PAGES.quiz = m => {
  const LV = { easy: ['Leicht', 'etwa Note 4', 1], medium: ['Mittel', 'etwa Note 5', 2], hard: ['Schwer', 'etwa Note 6', 3] };
  const N = 18;
  let level = S.quizLevel || 'medium';
  let qs = [], i = 0, score = 0, locked = false, wrong = [];

  function home() {
    keyHandler = null;
    m.innerHTML = `<div class="page narrow">${pageHead('Quiz', `Wähle eine Stufe. Du bekommst ${N} zufällige Fragen aus allen 9 Kapiteln und nach jeder Antwort eine Erklärung.`)}
      <div class="levels">${Object.entries(LV).map(([k, [t, d, n]]) => `
        <button class="level ${k === level ? 'on' : ''}" data-lv="${k}" type="button"><span class="lv-bars">${[1, 2, 3].map(x => `<i class="${x <= n ? 'f' : ''}"></i>`).join('')}</span><b>${t}</b><small>${d} · ${QUIZ[k].length} Fragen im Pool</small></button>`).join('')}</div>
      <div class="row" style="margin-top:22px"><button class="btn btn-p btn-lg" data-a="start" type="button">Quiz starten ${icon('arrowR')}</button></div>
      <div class="sec-h"><h2>Letzte Versuche</h2></div>
      ${histTable(S.quizHist, h => 'Quiz ' + LV[h.lv][0])}
    </div>`;
  }
  function start() {
    // aus jedem Kapitel mindestens eine Frage, der Rest zufällig
    const pool = QUIZ[level];
    const base = CHAPTERS.flatMap((_, k) => pick(pool.filter(q => q.ch === k + 1), 1));
    const rest = pick(pool.filter(q => !base.includes(q)), N - base.length);
    qs = shuffle([...base, ...rest]).map(q => ({ ...q, opts: shuffledOpts(q) }));
    i = 0; score = 0; wrong = [];
    keyHandler = (e, typing) => {
      if (typing) return;
      if (/^[1-4]$/.test(e.key) && !locked) answer(+e.key - 1);
      else if (e.key === 'Enter' && locked) { e.preventDefault(); next(); }
    };
    draw();
  }
  function draw() {
    const q = qs[i];
    locked = false;
    m.innerHTML = `<div class="page qz">
      <div class="qz-head"><span>Frage ${i + 1} von ${qs.length} · ${LV[level][0]}</span><span>${score} richtig</span></div>
      <div class="bar dark" style="margin-bottom:18px"><i style="width:${i / qs.length * 100}%"></i></div>
      <div class="card qz-card">
        <div class="qz-lz">Kapitel ${q.ch} · ${CHAPTERS[q.ch - 1].short}</div>
        <div class="qz-q">${esc(q.q)}</div>
        <div class="opts" id="opts">${q.opts.map((o, k) => `<button class="opt" data-o="${k}" type="button"><span class="opt-l">${'ABCD'[k]}</span><span>${esc(o.t)}</span></button>`).join('')}</div>
        <div id="fb"></div>
      </div>
      <div class="qz-foot"><span class="muted" style="font-size:14px">Antworten mit <span class="kbd">1</span> bis <span class="kbd">4</span>, weiter mit <span class="kbd">Enter</span></span><button class="btn btn-g" data-a="quit" type="button">Abbrechen</button></div>
    </div>`;
  }
  function answer(k) {
    if (locked) return;
    locked = true;
    const q = qs[i], o = q.opts[k];
    $('#opts', m).classList.add('locked');
    $$('.opt', m).forEach((b, j) => { if (q.opts[j].ok) b.classList.add('ok'); else if (j === k) b.classList.add('no'); });
    if (o.ok) score++; else wrong.push({ q, given: o.t });
    $('#fb', m).innerHTML = `<div class="fb ${o.ok ? 'ok' : 'no'}" style="margin-top:18px"><span class="fb-t">${icon(o.ok ? 'check' : 'x')}${o.ok ? 'Richtig!' : 'Leider falsch'}</span><span class="fb-x">${esc(q.ex)}</span></div>
      <div class="row" style="justify-content:flex-end;margin-top:16px"><button class="btn btn-p" data-a="next" type="button">${i === qs.length - 1 ? 'Zur Auswertung' : 'Weiter'} ${icon('arrowR')}</button></div>`;
    $('.qz-head span:last-child', m).textContent = `${score} richtig`;
    $('[data-a="next"]', m).focus({ preventScroll: true });
  }
  function next() { if (i < qs.length - 1) { i++; draw(); window.scrollTo(0, 0); } else end(); }
  function end() {
    keyHandler = null;
    const p = score / qs.length, g = gradeOf(p);
    S.quizHist.unshift({ t: Date.now(), lv: level, s: score, n: qs.length, g });
    S.quizHist = S.quizHist.slice(0, 8);
    save();
    m.innerHTML = `<div class="page qz"><div class="card result">
        <span class="badge-ic">${icon(score === qs.length ? 'trophy' : 'target')}</span>
        <div class="grade-l">Geschätzte Note</div><div class="grade">${fmtGrade(g)}</div>
        <h2>${gradeText(g)}</h2>
        <div class="res-stats"><div><b>${score}/${qs.length}</b><span>richtig</span></div><div><b>${Math.round(p * 100)}%</b><span>Trefferquote</span></div><div><b>${LV[level][0]}</b><span>Stufe</span></div></div>
        <div class="row" style="justify-content:center;margin-top:8px"><button class="btn btn-p" data-a="start" type="button">${icon('rotate')}Nochmals</button><button class="btn btn-s" data-a="home" type="button">Andere Stufe</button></div>
      </div>
      ${wrong.length ? `<div class="sec-h"><h2>Deine Fehler</h2><p>Lies die Erklärungen nochmals durch.</p></div><div class="review">${wrong.map(w => `
        <div class="rv no"><span class="rv-q">${esc(w.q.q)}</span><span class="rv-a">Deine Antwort: <b class="y">${esc(w.given)}</b> · Richtig: <b class="c">${esc(w.q.a[0])}</b></span><span class="rv-x">${esc(w.q.ex)}</span></div>`).join('')}</div>` : ''}
    </div>`;
    window.scrollTo(0, 0);
    if (score === qs.length) confetti();
  }
  m.addEventListener('click', e => {
    const b = e.target.closest('[data-a],[data-lv],[data-o]');
    if (!b) return;
    if (b.dataset.lv) { level = b.dataset.lv; S.quizLevel = level; save(); home(); return; }
    if (b.dataset.o !== undefined) { answer(+b.dataset.o); return; }
    ({ start, next, quit: home, home })[b.dataset.a]?.();
  });
  home();
};

/* ===== Prüfungssimulation ===== */
function calcTask() {
  const sets = [['Helvetia', 'Käse', 'Uhren'], ['Alpland', 'Weizen', 'Fisch'], ['Portus', 'Wein', 'Stoff']];
  const [land, g1, g2] = sets[Math.floor(Math.random() * sets.length)];
  const pairs = [[3, 6], [2, 8], [4, 2], [5, 10], [6, 3], [8, 2], [4, 6], [5, 2]];
  const [x, y] = pairs[Math.floor(Math.random() * pairs.length)];
  return { type: 'calc', land, g1, g2, x, y, want: y / x };
}
PAGES.exam = m => {
  const DURATION = 15 * 60 * 1000;
  let tasks = [], ans = [], cur = 0, timer = null, endAt = 0, armed = false, armT = null;
  onLeave(() => { clearInterval(timer); clearTimeout(armT); });

  function home() {
    keyHandler = null;
    m.innerHTML = `<div class="page narrow">${pageHead('Prüfungssimulation', '15 gemischte Aufgaben aus allen 9 Kapiteln in 15 Minuten. Wie in der echten Prüfung siehst du erst am Schluss, was richtig war.')}
      <div class="card settings">
        <div class="fields" style="margin:0">
          <div class="field"><b>${icon('quiz')}8 × Multiple Choice</b><div>Aus verschiedenen Kapiteln</div></div>
          <div class="field"><b>${icon('pen')}4 × Lückentext</b><div>Fachbegriffe eintippen</div></div>
          <div class="field"><b>${icon('link')}2 × Zuordnung</b><div>je 4 Paare</div></div>
          <div class="field"><b>${icon('calc')}1 × Rechnung</b><div>Opportunitätskosten</div></div>
        </div>
        ${H.box('amber', 'So läuft es', '<p>Du hast <b>15 Minuten</b>. Du kannst zwischen den Aufgaben hin und her springen. Wenn die Zeit abläuft, wird automatisch abgegeben.</p>')}
        <div class="row"><button class="btn btn-p btn-lg" data-a="begin" type="button">${icon('timer')}Prüfung starten</button></div>
      </div>
      <div class="sec-h"><h2>Letzte Versuche</h2></div>
      ${histTable(S.examHist, () => 'Prüfung')}
    </div>`;
    decorate(m);
  }
  function build() {
    const pool = [...QUIZ.medium, ...QUIZ.hard];
    const chs = shuffle(CHAPTERS.map((_, k) => k + 1)).slice(0, 8);
    const mc = chs.map(c => pick(pool.filter(q => q.ch === c), 1)[0]).map(q => ({ type: 'mc', q, opts: shuffledOpts(q) }));
    const gp = pick(GAPS.flatMap(s => s.items.map(it => ({ it, set: s }))), 4).map(x => ({ type: 'gap', ...x }));
    const mt = pick(MATCH, 2).map(set => { const pairs = pick(set.pairs, 4); return { type: 'match', set, pairs, rights: shuffle(pairs.map(p => p[1])) }; });
    return shuffle([...mc, ...gp, ...mt, calcTask()]);
  }
  function begin() {
    tasks = build();
    ans = tasks.map(t => t.type === 'match' ? ['', '', '', ''] : t.type === 'mc' ? null : '');
    cur = 0; armed = false;
    endAt = Date.now() + DURATION;
    m.innerHTML = `<div class="page narrow">
      <div class="card ex-top"><div class="ex-sub"><b>Prüfungssimulation</b><div class="muted" style="font-size:14px"><span id="exAns">0</span> von ${tasks.length} beantwortet</div></div>
        <div class="timer" id="timer">${icon('clock')}<span>15:00</span></div>
        <button class="btn btn-p" data-a="submit" id="submitBtn" type="button">Abgeben</button></div>
      <div class="ex-nums" id="exNums"></div>
      <div class="card qz-card" id="exTask"></div>
      <div class="row" style="justify-content:space-between;margin-top:18px"><button class="btn btn-s" data-a="prev" type="button">${icon('arrowL')}Zurück</button><button class="btn btn-p" data-a="fwd" type="button">Weiter ${icon('arrowR')}</button></div>
    </div>`;
    timer = setInterval(tick, 500);
    tick();
    keyHandler = (e, typing) => {
      if (typing) { if (e.key === 'Enter' && e.target.tagName === 'INPUT') { e.preventDefault(); goTo(cur + 1); } return; }
      if (e.key === 'ArrowRight') goTo(cur + 1);
      if (e.key === 'ArrowLeft') goTo(cur - 1);
      if (/^[1-4]$/.test(e.key) && tasks[cur].type === 'mc') { ans[cur] = +e.key - 1; drawTask(); nums(); }
    };
    drawTask(); nums();
  }
  function tick() {
    const left = Math.max(0, endAt - Date.now());
    const s = Math.ceil(left / 1000);
    const el = $('#timer', m);
    if (!el) return;
    el.querySelector('span').textContent = `${String(Math.floor(s / 60)).padStart(2, '0')}:${String(s % 60).padStart(2, '0')}`;
    el.classList.toggle('warn', s <= 180 && s > 60);
    el.classList.toggle('crit', s <= 60);
    if (left <= 0) finish(true);
  }
  const answered = k => {
    const t = tasks[k], a = ans[k];
    if (t.type === 'mc') return a !== null;
    if (t.type === 'match') return a.some(x => x);
    return String(a).trim() !== '';
  };
  function nums() {
    $('#exNums', m).innerHTML = tasks.map((_, k) => `<button class="ex-num ${answered(k) ? 'ans' : ''} ${k === cur ? 'cur' : ''}" data-n="${k}" type="button" aria-label="Aufgabe ${k + 1}">${k + 1}</button>`).join('');
    $('#exAns', m).textContent = tasks.filter((_, k) => answered(k)).length;
  }
  function drawTask() {
    const t = tasks[cur], a = ans[cur];
    let html = '';
    if (t.type === 'mc') {
      html = `<div class="ex-type">Aufgabe ${cur + 1} · Multiple Choice · Kapitel ${t.q.ch}</div><div class="ex-task">${esc(t.q.q)}</div>
        <div class="opts">${t.opts.map((o, k) => `<button class="opt ${a === k ? 'sel' : ''}" data-o="${k}" type="button"><span class="opt-l">${'ABCD'[k]}</span><span>${esc(o.t)}</span></button>`).join('')}</div>`;
    } else if (t.type === 'gap') {
      const [pre, , post] = t.it.t.split(/\{([^}]*)\}/);
      html = `<div class="ex-type">Aufgabe ${cur + 1} · Lückentext · ${t.set.title}</div><div class="ex-task" style="font-weight:500">${t.set.task}</div>
        <div class="gap" style="box-shadow:none"><span class="gap-n">${icon('pen')}</span><div><span class="gap-q">${esc(t.it.q)}</span>${esc(pre)}<input class="inp" data-f="gap" value="${esc(a)}" autocomplete="off" spellcheck="false" style="width:18ch" aria-label="Lücke">${esc(post)} <span class="hint">(${esc(t.it.h)})</span></div></div>`;
    } else if (t.type === 'match') {
      html = `<div class="ex-type">Aufgabe ${cur + 1} · Zuordnung · ${t.set.title}</div><div class="ex-task">${t.set.task}</div>
        <div class="ex-match">${t.pairs.map((p, k) => `<div class="ex-match-r"><div>${esc(p[0])}</div><select class="inp" data-f="match" data-k="${k}" aria-label="Zuordnung ${k + 1}"><option value="">Wähle …</option>${t.rights.map(r => `<option ${a[k] === r ? 'selected' : ''}>${esc(r)}</option>`).join('')}</select></div>`).join('')}</div>`;
    } else {
      html = `<div class="ex-type">Aufgabe ${cur + 1} · Rechnung · Opportunitätskosten</div>
        <div class="ex-task">${t.land} kann pro Stunde entweder ${t.x} ${t.g1} oder ${t.y} ${t.g2} herstellen. Was kostet 1 ${t.g1}, gemessen in ${t.g2}?</div>
        <input class="inp" data-f="calc" value="${esc(a)}" autocomplete="off" inputmode="decimal" placeholder="Zahl, zum Beispiel 0.5" aria-label="Ergebnis">`;
    }
    $('#exTask', m).innerHTML = html;
    $('[data-a="prev"]', m).disabled = cur === 0;
    $('[data-a="fwd"]', m).disabled = cur === tasks.length - 1;
    const inp = $('#exTask input', m);
    if (inp && matchMedia('(min-width: 900px)').matches) inp.focus({ preventScroll: true });
  }
  function goTo(k) { if (k < 0 || k >= tasks.length) return; cur = k; drawTask(); nums(); }
  function onField(e) {
    const el = e.target;
    if (!el.dataset || !el.dataset.f) return;
    if (el.dataset.f === 'match') ans[cur][+el.dataset.k] = el.value;
    else ans[cur] = el.value;
    nums();
  }
  m.addEventListener('input', onField);
  m.addEventListener('change', onField);

  function submit() {
    const open = tasks.filter((_, k) => !answered(k)).length;
    const b = $('#submitBtn', m);
    if (open && !armed) {
      armed = true;
      b.textContent = `Wirklich abgeben? ${open} offen`;
      b.classList.replace('btn-p', 'btn-no');
      armT = setTimeout(() => { armed = false; if (b.isConnected) { b.textContent = 'Abgeben'; b.classList.replace('btn-no', 'btn-p'); } }, 4000);
      return;
    }
    finish(false);
  }
  function finish(timeUp) {
    clearInterval(timer); clearTimeout(armT);
    keyHandler = null;
    let pts = 0;
    const rows = tasks.map((t, k) => {
      const a = ans[k];
      if (t.type === 'mc') {
        const ok = a !== null && t.opts[a].ok;
        pts += ok ? 1 : 0;
        return { st: ok ? 'ok' : 'no', q: t.q.q, your: a === null ? 'keine Antwort' : t.opts[a].t, right: t.q.a[0], x: t.q.ex, p: ok ? 1 : 0 };
      }
      if (t.type === 'gap') {
        const alts = t.it.t.match(/\{([^}]*)\}/)[1].split('|');
        const ok = CHECK.right(CHECK.word(a, alts));
        pts += ok ? 1 : 0;
        return { st: ok ? 'ok' : 'no', q: `${t.it.q} ${t.it.t.replace(/\{[^}]*\}/, '___')}`, your: a.trim() || 'keine Antwort', right: alts[0], x: '', p: ok ? 1 : 0 };
      }
      if (t.type === 'match') {
        const n = t.pairs.filter((p, j) => a[j] === p[1]).length;
        pts += n / 4;
        return { st: n === 4 ? 'ok' : n ? 'half' : 'no', q: t.set.task, your: `${n} von 4 Paaren richtig`, right: t.pairs.map(p => `${p[0]}: ${p[1]}`).join(' · '), x: '', p: n / 4 };
      }
      const ok = CHECK.near(CHECK.number(a), t.want);
      pts += ok ? 1 : 0;
      return { st: ok ? 'ok' : 'no', q: `${t.land}: ${t.x} ${t.g1} oder ${t.y} ${t.g2}. Was kostet 1 ${t.g1}?`, your: String(a).trim() || 'keine Antwort', right: `${n2(t.want)} ${t.g2}`, x: `Anderes Gut geteilt durch betrachtetes Gut: ${t.y} ÷ ${t.x} = ${n2(t.want)}`, p: ok ? 1 : 0 };
    });
    const g = gradeOf(pts / tasks.length);
    const used = Math.min(DURATION, DURATION - Math.max(0, endAt - Date.now()));
    S.examHist.unshift({ t: Date.now(), s: Math.round(pts * 100) / 100, n: tasks.length, g });
    S.examHist = S.examHist.slice(0, 8);
    save();
    const fmtP = x => String(Math.round(x * 100) / 100);
    m.innerHTML = `<div class="page narrow"><div class="card result">
        <span class="badge-ic">${icon(pts === tasks.length ? 'trophy' : 'flag')}</span>
        ${timeUp ? '<p><b>Die Zeit ist abgelaufen.</b> Deine Antworten wurden automatisch abgegeben.</p>' : ''}
        <div class="grade-l">Geschätzte Note</div><div class="grade">${fmtGrade(g)}</div>
        <h2>${gradeText(g)}</h2>
        <div class="res-stats"><div><b>${fmtP(pts)}/${tasks.length}</b><span>Punkte</span></div><div><b>${Math.round(pts / tasks.length * 100)}%</b><span>erreicht</span></div><div><b>${Math.floor(used / 60000)}:${String(Math.floor(used / 1000) % 60).padStart(2, '0')}</b><span>Minuten gebraucht</span></div></div>
        <div class="row" style="justify-content:center;margin-top:8px"><button class="btn btn-p" data-a="begin" type="button">${icon('rotate')}Neue Prüfung</button><button class="btn btn-s" data-a="home" type="button">Übersicht</button></div>
      </div>
      <div class="sec-h"><h2>Korrektur</h2><p>Alle Aufgaben mit deiner Antwort und der richtigen Lösung.</p></div>
      <div class="review">${rows.map((r, k) => `
        <div class="rv ${r.st}"><span class="rv-q">${k + 1}. ${esc(r.q)} <span class="muted" style="font-weight:500">(${fmtP(r.p)} P.)</span></span>
        <span class="rv-a">Deine Antwort: <b class="${r.st === 'ok' ? 'c' : 'y'}">${esc(r.your)}</b>${r.st === 'ok' ? '' : ` · Richtig: <b class="c">${esc(r.right)}</b>`}</span>
        ${r.x ? `<span class="rv-x">${esc(r.x)}</span>` : ''}</div>`).join('')}</div>
    </div>`;
    window.scrollTo(0, 0);
    if (pts === tasks.length) confetti();
  }
  m.addEventListener('click', e => {
    const b = e.target.closest('[data-a],[data-o],[data-n]');
    if (!b) return;
    if (b.dataset.o !== undefined) { ans[cur] = +b.dataset.o; drawTask(); nums(); return; }
    if (b.dataset.n !== undefined) { goTo(+b.dataset.n); return; }
    ({ begin, home, submit, prev: () => goTo(cur - 1), fwd: () => goTo(cur + 1) })[b.dataset.a]?.();
  });
  home();
};

/* ===== Grafik-Trainer ===== */
PAGES.grafik = m => {
  let idx = 0;
  function draw() {
    const g = GRAFIK[idx];
    m.innerHTML = `<div class="page narrow">${pageHead('Grafik-Trainer', 'Übe die drei Schritte: beschreiben, begründen, einordnen. Überlege zuerst selbst, dann öffne die Lösung.')}
      <div class="tools"><div class="chips">${GRAFIK.map((x, k) => `<button class="chip ${k === idx ? 'on' : ''}" data-g="${k}" type="button">${x.short}</button>`).join('')}</div></div>
      <div class="card card-b">
        <h2 class="gr-t">${g.title}</h2><p class="gr-u">${g.unit}</p>
        <div data-chart="${g.id}"></div>
        <p class="gr-s">Quelle: ${g.source}</p>
      </div>
      <div class="sec-h" style="margin-top:32px"><h2>Interpretieren</h2></div>
      ${H.tries('Sage es zuerst laut oder schreibe es auf.', [['1. Beschreiben: Was zeigt die Grafik?', g.steps[0]], ['2. Begründen: Warum ist das so?', g.steps[1]], ['3. Einordnen: Was hat das mit Globalisierung zu tun?', g.steps[2]]])}
      <div class="sec-h" style="margin-top:32px"><h2>Kurz prüfen</h2></div>
      <div id="grQ">${g.checks.map((q, k) => `<div class="card qz-card" style="margin-bottom:14px"><div class="qz-q" style="font-size:19px">${esc(q.q)}</div><div class="opts" data-q="${k}">${shuffledOpts(q).map(o => `<button class="opt" data-ok="${o.ok ? 1 : 0}" type="button"><span class="opt-l">${icon('chevR')}</span><span>${esc(o.t)}</span></button>`).join('')}</div><div data-fb></div></div>`).join('')}</div>
    </div>`;
    mountChart($('[data-chart]', m), g);
  }
  m.addEventListener('click', e => {
    const c = e.target.closest('[data-g]');
    if (c) { idx = +c.dataset.g; draw(); return; }
    const o = e.target.closest('.opt');
    if (!o) return;
    const box = o.closest('.opts');
    if (box.classList.contains('locked')) return;
    box.classList.add('locked');
    const ok = o.dataset.ok === '1';
    $$('.opt', box).forEach(b => { if (b.dataset.ok === '1') b.classList.add('ok'); });
    if (!ok) o.classList.add('no');
    const q = GRAFIK[idx].checks[+box.dataset.q];
    box.nextElementSibling.innerHTML = `<div class="fb ${ok ? 'ok' : 'no'}" style="margin-top:14px"><span class="fb-t">${icon(ok ? 'check' : 'x')}${ok ? 'Richtig!' : 'Leider falsch'}</span><span class="fb-x">${esc(q.ex)}</span></div>`;
  });
  draw();
};

/* ===== Opportunitätskosten-Trainer ===== */
PAGES.rechner = m => {
  const SETS = [['Helvetia', 'Portus', 'Käse', 'Uhren'], ['Alpland', 'Meerland', 'Weizen', 'Fisch'], ['Nordia', 'Sudia', 'Schokolade', 'Maschinen'], ['Schweiz', 'Bangladesch', 'Medikamente', 'T-Shirts']];
  const V = [1, 2, 3, 4, 5, 6, 8, 10];
  const rnd = a => a[Math.floor(Math.random() * a.length)];
  let mode = 'task', t = null, checked = false, right = 0, total = 0;
  function newTask() {
    const [a, b, g1, g2] = rnd(SETS);
    let A, B;
    do { A = { n: a, x: rnd(V), y: rnd(V) }; B = { n: b, x: rnd(V), y: rnd(V) }; } while (A.x * B.y === B.x * A.y || (A.x === B.x && A.y === B.y));
    t = solveTrade(A, B, g1, g2);
    checked = false;
  }
  function shell() {
    m.innerHTML = `<div class="page narrow">${pageHead('Opportunitätskosten', 'Rechne mit dem Rezept von Robertson: Opportunitätskosten bestimmen, spaltenweise vergleichen, spezialisieren.')}
      <div class="tools"><div class="chips"><button class="chip ${mode === 'task' ? 'on' : ''}" data-m="task" type="button">Aufgaben lösen</button><button class="chip ${mode === 'free' ? 'on' : ''}" data-m="free" type="button">Frei rechnen</button></div></div>
      <div id="rcBody"></div></div>`;
    const body = $('#rcBody', m);
    if (mode === 'free') { TOOLS.kompar(body); return; }
    if (!t) newTask();
    drawTask();
  }
  function drawTask() {
    const { A, B, g1, g2 } = t;
    const inp = (k, want, g) => `<input class="inp mini" data-k="${k}" data-want="${want}" inputmode="decimal" autocomplete="off" aria-label="${k}"> <span class="muted">${g}</span>`;
    const sel = k => `<select class="inp" data-s="${k}"><option value="">Wähle …</option><option>${A.n}</option><option>${B.n}</option></select>`;
    $('#rcBody', m).innerHTML = `<div class="card tr-card">
      <span class="tr-ask">${total ? `${right} von ${total} richtig` : 'Beide Länder haben je 100 Arbeitsstunden. Das schafft eine Arbeitskraft pro Stunde:'}</span>
      ${H.tbl(['Land', `${g1} pro Stunde`, `${g2} pro Stunde`], [[A.n, A.x, A.y], [B.n, B.x, B.y]])}
      <b>Schritt 2: Opportunitätskosten (auf 2 Stellen gerundet)</b>
      <div class="tbl-wrap"><table class="tbl"><thead><tr><th>Land</th><th>1 ${g1} kostet</th><th>1 ${g2} kostet</th></tr></thead><tbody>
        <tr><td>${A.n}</td><td>${inp('Aa', t.oa.a, g2)}</td><td>${inp('Ab', t.oa.b, g1)}</td></tr>
        <tr><td>${B.n}</td><td>${inp('Ba', t.ob.a, g2)}</td><td>${inp('Bb', t.ob.b, g1)}</td></tr>
      </tbody></table></div>
      <b>Schritt 3: Wer hat den komparativen Vorteil?</b>
      <div class="sel2"><label>Bei ${g1}${sel('x')}</label><label>Bei ${g2}${sel('y')}</label></div>
      <div id="rcFb"></div>
      <div class="row"><button class="btn btn-p" data-a="check" type="button">${icon('check')}Prüfen</button><button class="btn btn-s" data-a="new" type="button">${icon('shuffle')}Neue Aufgabe</button></div>
    </div>`;
  }
  function check() {
    if (checked) return;
    let ok = true;
    $$('[data-want]', m).forEach(i => {
      const good = CHECK.near(CHECK.number(i.value), +i.dataset.want);
      i.classList.remove('ok', 'no');
      i.classList.add(good ? 'ok' : 'no');
      if (!good) ok = false;
    });
    const sx = $('[data-s="x"]', m), sy = $('[data-s="y"]', m);
    const gx = sx.value === t.compX.n, gy = sy.value === t.compY.n;
    [[sx, gx], [sy, gy]].forEach(([s, g]) => { s.classList.remove('ok', 'no'); s.classList.add(g ? 'ok' : 'no'); });
    if (!gx || !gy) ok = false;
    checked = true; total++;
    if (ok) right++;
    const { A, B, g1, g2 } = t, X = t.compX, Y = t.compY;
    $('#rcFb', m).innerHTML = `<div class="fb ${ok ? 'ok' : 'no'}"><span class="fb-t">${icon(ok ? 'check' : 'x')}${ok ? 'Alles richtig!' : 'Noch nicht ganz'}</span>
      <span class="fb-x">${A.n}: 1 ${g1} = ${A.y} ÷ ${A.x} = ${n2(t.oa.a)} ${g2} · 1 ${g2} = ${A.x} ÷ ${A.y} = ${n2(t.oa.b)} ${g1}<br>
      ${B.n}: 1 ${g1} = ${B.y} ÷ ${B.x} = ${n2(t.ob.a)} ${g2} · 1 ${g2} = ${B.x} ÷ ${B.y} = ${n2(t.ob.b)} ${g1}<br>
      <b>${X.n} macht ${g1}, ${Y.n} macht ${g2}.</b> Mit Spezialisierung: ${t.x1} ${g1} und ${t.y1} ${g2}, das sind +${t.x1 - t.x0} und +${t.y1 - t.y0} gegenüber vorher.</span></div>`;
    if (ok && right % 5 === 0) confetti();
  }
  m.addEventListener('click', e => {
    const b = e.target.closest('[data-a],[data-m]');
    if (!b) return;
    if (b.dataset.m) { mode = b.dataset.m; shell(); return; }
    if (b.dataset.a === 'check') check();
    if (b.dataset.a === 'new') { newTask(); drawTask(); }
  });
  keyHandler = (e, typing) => { if (typing && e.key === 'Enter' && mode === 'task') { e.preventDefault(); check(); } };
  shell();
};

/* ===== Ereignis-Check ===== */
PAGES.events = m => {
  const N = 10;
  let list = [], i = 0, score = 0, locked = false;
  function start() { list = pick(EVENTS, N); i = 0; score = 0; draw(); }
  function draw() {
    const ev = list[i];
    locked = false;
    m.innerHTML = `<div class="page qz">${pageHead('Ereignis-Check', 'Wie wirkt ein Ereignis auf den Globalisierungsgrad eines Landes?')}
      <div class="qz-head"><span>Ereignis ${i + 1} von ${N}</span><span>${score} richtig</span></div>
      <div class="bar dark" style="margin-bottom:18px"><i style="width:${i / N * 100}%"></i></div>
      <div class="card qz-card"><div class="qz-q">${esc(ev.t)}</div>
        <div class="two" id="evB"><button class="btn btn-ok btn-lg" data-d="1" type="button">${icon('arrowUp')}Globalisierung steigt</button><button class="btn btn-no btn-lg" data-d="-1" type="button"><span style="transform:rotate(180deg);display:grid">${icon('arrowUp')}</span>Globalisierung sinkt</button></div>
        <div id="evF"></div></div></div>`;
  }
  function answer(d) {
    if (locked) return;
    locked = true;
    const ev = list[i], ok = d === ev.d;
    if (ok) score++;
    $$('#evB .btn', m).forEach(b => { b.disabled = true; });
    $('.qz-head span:last-child', m).textContent = `${score} richtig`;
    $('#evF', m).innerHTML = `<div class="fb ${ok ? 'ok' : 'no'}" style="margin-top:16px"><span class="fb-t">${icon(ok ? 'check' : 'x')}${ok ? 'Richtig!' : 'Leider falsch'}: ${ev.d > 0 ? 'Sie steigt.' : 'Sie sinkt.'}</span><span class="fb-x">${esc(ev.ex)} Dimension: ${ev.dim}.</span></div>
      <div class="row" style="justify-content:flex-end;margin-top:14px"><button class="btn btn-p" data-a="next" type="button">${i === N - 1 ? 'Auswertung' : 'Weiter'} ${icon('arrowR')}</button></div>`;
    $('[data-a="next"]', m).focus({ preventScroll: true });
  }
  function next() {
    if (i < N - 1) { i++; draw(); return; }
    m.innerHTML = `<div class="page qz"><div class="card result"><span class="badge-ic">${icon(score === N ? 'trophy' : 'target')}</span><h2>${score} von ${N} richtig</h2><p>Überlege bei jedem Ereignis: Gibt es mehr oder weniger Austausch über die Grenzen?</p>
      <div class="row" style="justify-content:center;margin-top:8px"><button class="btn btn-p" data-a="again" type="button">${icon('rotate')}Neue Runde</button></div></div></div>`;
    if (score === N) confetti();
  }
  m.addEventListener('click', e => {
    const b = e.target.closest('[data-d],[data-a]');
    if (!b) return;
    if (b.dataset.d) answer(+b.dataset.d);
    if (b.dataset.a === 'next') next();
    if (b.dataset.a === 'again') start();
  });
  keyHandler = (e, typing) => { if (!typing && e.key === 'Enter' && locked) { e.preventDefault(); next(); } };
  start();
};

/* ===== Zuordnung: Paare (Drag and Drop mit Antippen als Alternative) und Sortieren ===== */
PAGES.match = m => {
  const SETS = [...SORTS.map(s => ({ ...s, kind: 'sort' })), ...MATCH.map(s => ({ ...s, kind: 'pair' }))];
  let setIdx = Math.min(S.mtSet || 0, SETS.length - 1);
  let pairs = [], order = [], toks = [], place = {}, sel = null, checked = false;
  const set = () => SETS[setIdx];
  const isSort = () => set().kind === 'sort';
  const label = t => isSort() ? set().items[t][0] : pairs[t][1];
  function load() {
    if (isSort()) { toks = shuffle(set().items.map((_, k) => k)); order = []; }
    else { pairs = set().pairs.slice(); order = shuffle(pairs.map((_, k) => k)); toks = shuffle(pairs.map((_, k) => k)); }
    place = {}; sel = null; checked = false;
    draw();
  }
  const tok = (t, st = '') => `<div class="tok ${sel === t ? 'sel' : ''} ${st}" draggable="true" data-t="${t}"><span>${esc(label(t))}</span><button class="x" data-x="${t}" type="button" aria-label="Entfernen">${icon('x')}</button></div>`;
  const inZone = t => place[t] !== undefined;
  function drawPairs() {
    const free = toks.filter(t => !inZone(t));
    return `<div class="mt"><div class="mt-rows">${order.map(z => {
      const t = toks.find(x => place[x] === z);
      const st = checked ? (t === z ? 'ok' : 'no') : '';
      return `<div class="mt-row"><div class="mt-p">${esc(pairs[z][0])}</div><div class="zone ${st} ${sel !== null && t === undefined ? 'target' : ''}" data-z="${z}">${t !== undefined ? tok(t) : '<span class="zph">Hierher ziehen</span>'}${checked && t !== z ? `<span class="mt-sol">Richtig: ${esc(pairs[z][1])}</span>` : ''}</div></div>`;
    }).join('')}</div>
    <div class="pool" data-z="pool"><span class="pool-h">${free.length ? `Karten (${free.length})` : 'Alle Karten verteilt'}</span>${free.map(t => tok(t)).join('')}</div></div>`;
  }
  function drawSort() {
    const free = toks.filter(t => !inZone(t));
    const it = set().items;
    return `<div class="pool" data-z="pool" style="position:static;margin-bottom:14px"><span class="pool-h">${free.length ? `Karten (${free.length})` : 'Alle Karten verteilt'}</span><div class="pool-w">${free.map(t => tok(t)).join('')}</div></div>
      <div class="bins" style="--n:${set().bins.length}">${set().bins.map((b, k) => `<div class="bin ${sel !== null ? 'target' : ''}" data-z="${k}"><b>${b}</b>${toks.filter(t => place[t] === k).map(t => tok(t, checked ? (it[t][1] === k ? 'good' : 'bad') : '')).join('')}</div>`).join('')}</div>`;
  }
  function count() { return isSort() ? toks.filter(t => place[t] === set().items[t][1]).length : order.filter(z => place[z] === z).length; }
  function draw() {
    const total = toks.length;
    m.innerHTML = `<div class="page">${pageHead('Zuordnung', 'Ziehe jede Karte an den richtigen Ort. Auf dem Handy tippst du zuerst eine Karte und dann ein Feld an.')}
      <div class="tools"><div class="chips">${SETS.map((s, k) => `<button class="chip ${k === setIdx ? 'on' : ''}" data-s="${k}" type="button">${s.title}</button>`).join('')}</div></div>
      <p style="margin:0 0 16px;font-weight:500">${set().task}</p>
      ${isSort() ? drawSort() : drawPairs()}
      <div class="row" style="margin-top:22px"><button class="btn btn-p" data-a="check" type="button">${icon('check')}Prüfen</button><button class="btn btn-s" data-a="reset" type="button">${icon('rotate')}Zurücksetzen</button>
        ${checked ? `<span class="score" style="margin-left:8px">${count()} von ${total} richtig</span>` : ''}</div>
    </div>`;
  }
  function putAt(t, z) {
    if (z === 'pool') delete place[t];
    else {
      if (!isSort()) Object.keys(place).forEach(k => { if (place[k] === z) delete place[k]; });
      place[t] = z;
    }
    sel = null; checked = false;
    draw();
  }
  function check() {
    checked = true; sel = null; draw();
    if (count() === toks.length) confetti();
  }
  const zoneOf = el => el.dataset.z === 'pool' ? 'pool' : +el.dataset.z;
  m.addEventListener('click', e => {
    const x = e.target.closest('[data-x]');
    if (x) { putAt(+x.dataset.x, 'pool'); return; }
    const t = e.target.closest('.tok');
    const z = e.target.closest('[data-z]');
    const n = t ? +t.dataset.t : null;
    if (t && z && z.dataset.z === 'pool') { sel = sel === n ? null : n; draw(); return; }
    if (sel !== null && z && n !== sel) { putAt(sel, zoneOf(z)); return; }
    if (t) { sel = sel === n ? null : n; draw(); return; }
    const b = e.target.closest('[data-a],[data-s]');
    if (!b) return;
    if (b.dataset.s !== undefined) { setIdx = +b.dataset.s; S.mtSet = setIdx; save(); return load(); }
    if (b.dataset.a === 'check') check();
    if (b.dataset.a === 'reset') { place = {}; sel = null; checked = false; draw(); }
  });
  m.addEventListener('dragstart', e => {
    const t = e.target.closest('.tok');
    if (!t) return;
    e.dataTransfer.setData('text/plain', t.dataset.t);
    e.dataTransfer.effectAllowed = 'move';
    t.classList.add('drag');
  });
  m.addEventListener('dragend', e => { e.target.closest?.('.tok')?.classList.remove('drag'); });
  m.addEventListener('dragover', e => {
    const z = e.target.closest('[data-z]');
    if (!z) return;
    e.preventDefault();
    $$('.over', m).forEach(o => o !== z && o.classList.remove('over'));
    z.classList.add('over');
  });
  m.addEventListener('dragleave', e => { const z = e.target.closest('[data-z]'); if (z && !z.contains(e.relatedTarget)) z.classList.remove('over'); });
  m.addEventListener('drop', e => {
    const z = e.target.closest('[data-z]');
    if (!z) return;
    e.preventDefault();
    const t = e.dataTransfer.getData('text/plain');
    if (t === '') return;
    putAt(+t, zoneOf(z));
  });
  load();
};

/* ===== Lückentext ===== */
PAGES.gap = m => {
  let setIdx = Math.min(S.gapSet || 0, GAPS.length - 1);
  function draw() {
    const set = GAPS[setIdx];
    m.innerHTML = `<div class="page narrow">${pageHead('Lückentext', 'Tippe das fehlende Wort in die Lücke. Mit <span class="kbd">Enter</span> springst du zur nächsten Lücke.')}
      <div class="tools"><div class="chips">${GAPS.map((s, k) => `<button class="chip ${k === setIdx ? 'on' : ''}" data-s="${k}" type="button">${s.title}</button>`).join('')}</div></div>
      <p style="margin:0 0 16px;font-weight:500">${set.task}</p>
      <div class="gaps">${set.items.map((it, k) => {
        const [pre, ans, post] = it.t.split(/\{([^}]*)\}/);
        const w = Math.max(9, ans.split('|')[0].length + 3);
        return `<div class="gap"><span class="gap-n">${k + 1}</span><div><span class="gap-q">${esc(it.q)}</span>${esc(pre)}<input class="inp" data-k="${k}" autocomplete="off" spellcheck="false" style="width:${w}ch" aria-label="Lücke ${k + 1}">${esc(post)} <span class="hint">(${esc(it.h)})</span><span class="sol" id="sol${k}"></span></div></div>`;
      }).join('')}</div>
      <div class="row" style="margin-top:22px"><button class="btn btn-p" data-a="check" type="button">${icon('check')}Prüfen</button><button class="btn btn-s" data-a="show" type="button">${icon('eye')}Lösungen zeigen</button><button class="btn btn-g" data-a="reset" type="button">${icon('rotate')}Zurücksetzen</button><span class="score" id="gapScore"></span></div>
    </div>`;
  }
  const answers = k => GAPS[setIdx].items[k].t.match(/\{([^}]*)\}/)[1].split('|');
  function check() {
    let n = 0;
    $$('.gap .inp', m).forEach(inp => {
      const k = +inp.dataset.k, alts = answers(k);
      const r = CHECK.word(inp.value, alts), ok = CHECK.right(r);
      inp.classList.remove('ok', 'no');
      inp.classList.add(ok ? 'ok' : 'no');
      $('#sol' + k, m).textContent = ok ? (r === 'typo' ? 'Richtig geschrieben: ' + alts[0] : '') : 'Richtig: ' + alts[0];
      if (ok) n++;
    });
    const total = GAPS[setIdx].items.length;
    $('#gapScore', m).textContent = `${n} von ${total} richtig`;
    if (n === total) confetti();
  }
  m.addEventListener('click', e => {
    const b = e.target.closest('[data-a],[data-s]');
    if (!b) return;
    if (b.dataset.s !== undefined) { setIdx = +b.dataset.s; S.gapSet = setIdx; save(); return draw(); }
    if (b.dataset.a === 'check') check();
    if (b.dataset.a === 'show') {
      $$('.gap .inp', m).forEach(inp => { const k = +inp.dataset.k; inp.value = answers(k)[0]; inp.classList.remove('ok', 'no'); $('#sol' + k, m).textContent = ''; });
      $('#gapScore', m).textContent = 'Lösungen eingefüllt';
    }
    if (b.dataset.a === 'reset') draw();
  });
  m.addEventListener('keydown', e => {
    if (e.key !== 'Enter' || !e.target.matches('.gap .inp')) return;
    e.preventDefault();
    const all = $$('.gap .inp', m), k = all.indexOf(e.target);
    if (k < all.length - 1) all[k + 1].focus(); else check();
  });
  draw();
};

/* ===== Stellungnahme üben ===== */
PAGES.stellung = m => {
  let idx = 0;
  function draw() {
    const s = STATEMENTS[idx];
    m.innerHTML = `<div class="page narrow">${pageHead('Stellungnahme üben', 'Verlangt ist eine Beurteilung, keine Liste. Schreibe zuerst selbst, dann vergleiche mit der Musterantwort.')}
      <div class="tools"><div class="chips">${STATEMENTS.map((x, k) => `<button class="chip ${k === idx ? 'on' : ''}" data-i="${k}" type="button">Kapitel ${x.ch}</button>`).join('')}</div></div>
      <div class="card tr-card">
        <span class="tr-ask">Kapitel ${s.ch} · ${CHAPTERS[s.ch - 1].short}</span>
        <div class="tr-word sm">${esc(s.q)}</div>
        <div class="steps">
          <div class="step"><span>1</span><div><b>Aus wessen Sicht?</b> Nenne die Perspektiven.</div></div>
          <div class="step"><span>2</span><div><b>Wie gross ist die Wirkung?</b> Gewichte die Argumente.</div></div>
          <div class="step"><span>3</span><div><b>Gibt es eine Alternative?</b> Dann folgt dein begründetes Fazit.</div></div>
        </div>
        <textarea class="inp area" rows="7" placeholder="Deine Stellungnahme" aria-label="Deine Stellungnahme"></textarea>
        <div class="row"><button class="btn btn-p" data-a="show" type="button">${icon('eye')}Mit Muster vergleichen</button></div>
        <div id="stOut"></div>
      </div></div>`;
  }
  m.addEventListener('click', e => {
    const c = e.target.closest('[data-i]');
    if (c) { idx = +c.dataset.i; draw(); return; }
    if (e.target.closest('[data-a="show"]')) {
      const s = STATEMENTS[idx];
      $('#stOut', m).innerHTML = `<div class="st"><b>Hast du das drin?</b>${s.points.map(p => `<label class="tick"><input type="checkbox"><span>${esc(p)}</span></label>`).join('')}</div>
        <div class="st ok"><b>Musterantwort</b><br>${esc(s.model)}</div>`;
    }
  });
  draw();
};

/* ===== Interaktive Seiten ===== */
const toolPage = (id, title, desc, ch) => {
  PAGES[id] = m => {
    m.innerHTML = `<div class="page narrow">${pageHead(title, desc)}<div id="toolEl"></div><p class="muted" style="margin-top:18px">Mehr dazu: <a href="#/full/${ch}">Kapitel ${ch} in der Full Summary</a></p></div>`;
    TOOLS[id]($('#toolEl', m));
  };
};
toolPage('bilanz', 'Bilanz nach Standpunkt', 'Es gibt keine allgemeingültige Bilanz des Handels. Die Antwort hängt vom Standpunkt ab.', 6);
toolPage('smile', 'Smile-Curve', 'Die Wertschöpfung ist entlang der Kette sehr ungleich verteilt.', 7);
toolPage('zoll', 'Zoll-Simulator', 'Wer gewinnt, wer verliert? Verschiebe den Zollsatz und beobachte die Wirkung.', 8);
toolPage('transport', 'Transportvergleich', 'Wer in drei Tagen liefern will, muss fliegen. Vergleiche die vier Wege.', 9);

$('#logoMark').innerHTML = icon('globe');
$('#sbToggle').innerHTML = icon('chevL');
$('#menuBtn').innerHTML = icon('menu');

$('#hubBtn').setAttribute('aria-label', 'Zurück zum LernHub');
$('#themeBtn').innerHTML = icon(document.documentElement.dataset.theme === 'dark' ? 'sun' : 'moon');
$('#themeBtn').addEventListener('click', toggleTheme);
$('#sbToggle').addEventListener('click', () => {
  S.sbCollapsed = document.documentElement.classList.toggle('sb-collapsed');
  save();
});
$('#menuBtn').addEventListener('click', () => document.documentElement.classList.add('sb-open'));
$('#backdrop').addEventListener('click', () => document.documentElement.classList.remove('sb-open'));
$('#backtop').addEventListener('click', () => window.scrollTo({ top: 0, behavior: 'smooth' }));
addEventListener('scroll', () => $('#backtop').classList.toggle('show', scrollY > 500), { passive: true });
addEventListener('hashchange', route);
renderObj();
route();
